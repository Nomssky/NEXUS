name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Least privilege: validation only, no writes, no publishing, no deployment.
permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format (gofmt)
        run: |
          out=$(gofmt -l cmd/ internal/ examples/)
          if [ -n "$out" ]; then
            echo "gofmt needed on:"
            echo "$out"
            exit 1
          fi

      - name: Vet (go vet)
        run: go vet ./...

      - name: Whitespace (git diff --check)
        run: git diff --check

      - name: Build all packages
        run: go build ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Test (race)
        run: go test -race -count=1 ./...

      - name: Backup/restore tests
        run: go test -count=1 ./internal/backup/

      - name: Production provider & storage gates
        run: |
          go test -count=1 ./internal/foundation/config/ ./internal/launcher/ ./internal/foundation/app/ \
            -run 'Production|Provider|FileStore|Storage|Development|Staging'

      - name: Rate limiting, CORS & security headers
        run: go test -count=1 ./internal/gateway/ -run 'RateLimit|CORS|SecurityHeaders|NoHSTS'

  release:
    name: Release build & artifact verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release artifacts
        run: make release VERSION=0.0.0-ci

      - name: Verify artifacts (checksums + manifest + inventory)
        run: make release-verify VERSION=0.0.0-ci

  smoke:
    name: Isolated backup/restore smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run smoke test (isolated temp dirs, dynamic ports)
        run: make smoke

  e2e:
    name: Black-box E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: e2e
        run: npx playwright test