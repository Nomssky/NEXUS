name: Auth module

# Dedicated quality gate for the authentication module
# (internal/foundation/identity). The repository-wide CI still runs the full
# suite; this workflow adds module-specific coverage, fuzzing and benchmark
# smoke gates so a regression in authentication is caught before merge.
#
# Validation only: no writes, no publishing, no deployment.

on:
  push:
    branches: [master, main]
    paths:
      - 'internal/foundation/identity/**'
      - 'go.mod'
      - 'Makefile'
      - '.github/workflows/auth.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'internal/foundation/identity/**'
      - 'go.mod'
      - 'Makefile'
      - '.github/workflows/auth.yml'

permissions:
  contents: read

concurrency:
  group: auth-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE: ./internal/foundation/identity/

jobs:
  quality:
    name: Auth tests, coverage & race
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format (gofmt)
        run: |
          out=$(gofmt -l internal/foundation/identity/)
          if [ -n "$out" ]; then
            echo "gofmt needed on:"
            echo "$out"
            exit 1
          fi

      - name: Vet (go vet)
        run: go vet $PACKAGE

      - name: Test with race detector and coverage
        run: |
          go test -count=1 -race -covermode=atomic \
            -coverprofile=coverage-auth.out $PACKAGE

      - name: Enforce auth module coverage gate (>= 90%)
        run: |
          covered=$(awk 'BEGIN{FS=" "} /auth_adapters\.go:|auth_service\.go:|authenticate\.go:/ {
              stmts=$2; total+=stmts; if ($3+0>0) covered+=stmts
            } END {
              if (total==0) { print "0.0"; exit }
              printf "%.1f", covered*100/total
            }' coverage-auth.out)
          echo "auth module statement coverage: ${covered}%"
          awk -v c="$covered" 'BEGIN { exit !(c >= 90) }' || {
            echo "::error::auth module coverage ${covered}% is below the 90% gate"
            exit 1
          }

      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: auth-coverage
          path: coverage-auth.out
          if-no-files-found: error

  fuzz:
    name: Fuzz smoke (10s per target)
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzAuthenticateUnknownIdentity
          - FuzzRegisterAuthenticateRoundTrip
          - FuzzHydrateNeverPanics
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz ${{ matrix.target }}
        run: |
          go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 10s $PACKAGE

  benchmark:
    name: Benchmark smoke
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run authentication benchmarks
        run: |
          go test -run '^$' -bench '^Benchmark' -benchtime=20x -benchmem $PACKAGE
